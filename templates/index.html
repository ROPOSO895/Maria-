body::after{content:'';position:fixed;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,0.3) 0%,rgba(0,0,0,0.1) 40%,rgba(0,0,0,0.85) 100%);z-index:0}

/* LAYOUT */
#app{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column}

/* TOP BAR */
.top{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:rgba(0,0,0,0.2);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,0.06);flex-shrink:0}
.top-left{display:flex;align-items:center;gap:10px}
.logo-ring{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--cyan);display:flex;align-items:center;justify-content:center;animation:spin 8s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.logo-inner{position:absolute;width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,var(--cyan),var(--pink));display:flex;align-items:center;justify-content:center;font-size:0.6rem;font-weight:700;color:#000;font-family:'Orbitron',sans-serif}
.logo-wrap{position:relative;width:34px;height:34px;display:flex;align-items:center;justify-content:center}
.top-title{font-family:'Orbitron',sans-serif;font-size:0.85rem;font-weight:700;letter-spacing:0.12em;color:var(--text)}
.top-info{display:flex;flex-direction:column;gap:1px}
#clk{font-size:0.6rem;color:var(--dim);font-family:'Orbitron',sans-serif}
.status-dot{width:6px;height:6px;border-radius:50%;background:#00ff88;display:inline-block;margin-right:4px;animation:blink 2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.4}}
#statusTxt{font-size:0.6rem;color:var(--dim)}
.top-right{display:flex;gap:6px}
.icon-btn{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,0.08);border:1px solid var(--border);color:var(--dim);font-size:0.75rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s}
.icon-btn:hover{background:rgba(0,229,255,0.15);color:var(--cyan)}

/* PAGES */
.pg{display:none;flex:1;flex-direction:column;overflow:hidden}
.pg.on{display:flex}

/* CHAT PAGE */
#pg-chat{position:relative}
.msgs{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
.msgs::-webkit-scrollbar{width:2px}
.msgs::-webkit-scrollbar-thumb{background:rgba(0,229,255,0.2);border-radius:2px}

/* WELCOME */
.welcome{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 16px 110px;text-align:center;pointer-events:none}
.welcome.hide{display:none}
.welcome-title{font-size:1.8rem;font-weight:700;background:linear-gradient(90deg,var(--cyan),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px;text-shadow:none;line-height:1.2}
.welcome-sub{font-size:0.7rem;color:rgba(255,255,255,0.4);margin-bottom:20px;letter-spacing:0.05em}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:340px;pointer-events:all;margin-top:16px}
.card{padding:14px 12px;border-radius:16px;background:rgba(0,0,0,0.45);border:1px solid rgba(255,255,255,0.12);cursor:pointer;backdrop-filter:blur(16px);display:flex;align-items:center;gap:10px;transition:all 0.2s;-webkit-tap-highlight-color:transparent}
.card:active{transform:scale(0.96);background:rgba(0,229,255,0.1);border-color:rgba(0,229,255,0.3)}
.card-ic{font-size:1.3rem;flex-shrink:0}
.card-txt{font-size:0.8rem;color:rgba(255,255,255,0.85);font-weight:500;text-align:left}

/* MESSAGES */
.msg-row{display:flex;align-items:flex-end;gap:8px;animation:slideIn 0.3s cubic-bezier(0.34,1.56,0.64,1)}
@keyframes slideIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.msg-row.u{flex-direction:row-reverse}
.av{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:0.65rem;font-weight:700;font-family:'Orbitron',sans-serif}
.av.m{background:linear-gradient(135deg,rgba(0,229,255,0.2),rgba(255,45,120,0.2));border:1px solid rgba(0,229,255,0.4);color:var(--cyan);animation:avGlow 2.5s ease-in-out infinite}
@keyframes avGlow{0%,100%{box-shadow:0 0 6px rgba(0,229,255,0.3)}50%{box-shadow:0 0 18px rgba(0,229,255,0.8)}}
.av.u{background:rgba(255,45,120,0.15);border:1px solid rgba(255,45,120,0.3);color:var(--pink)}
.bub{max-width:75%;padding:10px 14px;border-radius:18px;font-size:0.85rem;line-height:1.55;position:relative}
.msg-row.b .bub{background:rgba(0,229,255,0.07);border:1px solid rgba(0,229,255,0.12);border-bottom-left-radius:4px;backdrop-filter:blur(8px)}
.msg-row.u .bub{background:rgba(255,45,120,0.15);border:1px solid rgba(255,45,120,0.2);border-bottom-right-radius:4px}

/* SPEAK BUTTON on MARIA messages */
.speak-btn{position:absolute;bottom:-10px;right:8px;width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--cyan),var(--pink));border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:0.55rem;box-shadow:0 2px 8px rgba(0,229,255,0.4);transition:transform 0.2s}
.speak-btn:active{transform:scale(0.9)}
.speak-btn.speaking{animation:speakPulse 0.6s ease-in-out infinite}
@keyframes speakPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}

/* TYPING */
.typing-row{display:flex;align-items:center;gap:8px;padding:4px 0}
.typing-dots{display:flex;gap:4px;padding:10px 14px;background:rgba(0,229,255,0.07);border:1px solid rgba(0,229,255,0.12);border-radius:18px;border-bottom-left-radius:4px}
.typing-dots span{width:6px;height:6px;border-radius:50%;background:var(--cyan);animation:dot 1.2s ease-in-out infinite}
.typing-dots span:nth-child(2){animation-delay:0.2s}
.typing-dots span:nth-child(3){animation-delay:0.4s}
@keyframes dot{0%,60%,100%{transform:scale(0.6);opacity:0.4}30%{transform:scale(1);opacity:1}}

/* INPUT BAR */
.input-bar{padding:10px 12px;background:rgba(0,0,0,0.5);backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,0.07);display:flex;align-items:center;gap:8px;flex-shrink:0}
.inp-wrap{flex:1;display:flex;align-items:center;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.1);border-radius:24px;padding:0 14px;transition:border-color 0.2s}
.inp-wrap:focus-within{border-color:rgba(0,229,255,0.4);box-shadow:0 0 20px rgba(0,229,255,0.08)}
#msg{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:0.9rem;padding:11px 0;font-family:'Inter',sans-serif;resize:none;max-height:100px;line-height:1.4}
#msg::placeholder{color:var(--dim)}
.attach-btn{background:none;border:none;color:var(--dim);font-size:1rem;cursor:pointer;padding:4px;flex-shrink:0}
.mic-btn{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.08);border:1px solid var(--border);color:var(--dim);font-size:0.9rem;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.2s}
.mic-btn.on{background:rgba(255,45,120,0.2);border-color:var(--pink);color:var(--pink);animation:micPulse 1s ease-in-out infinite}
@keyframes micPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,45,120,0.4)}50%{box-shadow:0 0 0 8px rgba(255,45,120,0)}}
.send-btn{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,0.1);border:1px solid var(--border);color:var(--dim);font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.25s}
.send-btn.active{background:linear-gradient(135deg,var(--cyan),var(--pink));border-color:transparent;color:#000;box-shadow:0 4px 15px rgba(
