<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0d0015">
<title>P.E.P.P.E.R</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0d0015; color: #eee; font-family: 'Poppins', sans-serif; height: 100vh; display: flex; flex-direction: column; }

/* TOP */
.top { background: #1a0030; padding: 10px 14px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid rgba(255,110,180,0.3); flex-shrink: 0; }
.avatar { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #ff6eb4, #b44fff); display: flex; align-items: center; justify-content: center; font-size: 0.55rem; font-weight: 700; color: white; flex-shrink: 0; box-shadow: 0 0 12px rgba(255,110,180,0.4); letter-spacing: 0.05em; }
.name { font-weight: 600; font-size: 0.95rem; color: #ff6eb4; letter-spacing: 0.05em; }
.status { font-size: 0.65rem; color: rgba(255,255,255,0.4); }
.top-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.clk { font-size: 0.75rem; color: rgba(255,255,255,0.35); }
.icon-btn { background: none; border: none; color: rgba(255,255,255,0.4); font-size: 1rem; cursor: pointer; padding: 4px; }

/* WEATHER BAR */
.weather-bar { background: rgba(255,110,180,0.06); border-bottom: 1px solid rgba(255,110,180,0.1); padding: 6px 14px; display: none; align-items: center; gap: 8px; font-size: 0.72rem; color: rgba(255,255,255,0.6); flex-shrink: 0; }
.weather-bar.show { display: flex; }
.w-temp { color: #ffaa44; font-weight: 600; }

/* MSGS */
.msgs { flex: 1; overflow-y: scroll; -webkit-overflow-scrolling: touch; padding: 14px; padding-bottom: 110px; display: flex; flex-direction: column; gap: 10px; }
.msgs::-webkit-scrollbar { width: 3px; }
.msgs::-webkit-scrollbar-thumb { background: rgba(255,110,180,0.3); border-radius: 3px; }
.msg { display: flex; flex-direction: column; max-width: 82%; }
.msg.u { align-self: flex-end; align-items: flex-end; }
.msg.b { align-self: flex-start; align-items: flex-start; }
.lbl { font-size: 0.58rem; color: rgba(255,255,255,0.28); margin-bottom: 3px; letter-spacing: 0.05em; }
.bub { padding: 10px 14px; border-radius: 18px; font-size: 0.88rem; line-height: 1.65; font-weight: 300; }
.msg.u .bub { background: linear-gradient(135deg, rgba(255,110,180,0.22), rgba(180,79,255,0.18)); border: 1px solid rgba(255,110,180,0.28); border-bottom-right-radius: 4px; }
.msg.b .bub { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08); border-bottom-left-radius: 4px; color: rgba(255,255,255,0.88); }

/* IMAGE MSG */
.msg-img { max-width: 100%; border-radius: 12px; margin-top: 6px; }

/* NEWS */
.news-item { padding: 8px 0; border-bottom: 1px solid rgba(255,110,180,0.07); }
.news-item:last-child { border-bottom: none; }
.news-title { font-size: 0.78rem; color: rgba(255,255,255,0.85); line-height: 1.4; }
.news-src { font-size: 0.58rem; color: rgba(255,255,255,0.3); margin-top: 2px; }

/* TYPING */
.typing { display: none; align-self: flex-start; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08); border-radius: 18px; border-bottom-left-radius: 4px; padding: 10px 14px; gap: 5px; margin: 0 14px; }
.typing.show { display: flex; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: #b44fff; animation: bounce 1.2s infinite; }
.dot:nth-child(2) { animation-delay: 0.2s; }
.dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce { 0%,100% { transform: translateY(0); opacity: 0.4; } 50% { transform: translateY(-5px); opacity: 1; } }

/* BOT */
.bot { position: fixed; bottom: 0; left: 0; right: 0; background: #1a0030; border-top: 1px solid rgba(255,110,180,0.2); padding: 8px 12px 12px; display: flex; gap: 8px; align-items: flex-end; z-index: 999; }
#msg { flex: 1; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,110,180,0.3); border-radius: 22px; padding: 10px 16px; color: white; font-family: 'Poppins', sans-serif; font-size: 0.9rem; outline: none; resize: none; max-height: 100px; }
#msg:focus { border-color: #ff6eb4; }
#msg::placeholder { color: rgba(255,255,255,0.22); }
.send-btn { width: 42px; height: 42px; border-radius: 50%; background: linear-gradient(135deg, #ff6eb4, #b44fff); border: none; color: white; font-size: 1rem; cursor: pointer; flex-shrink: 0; box-shadow: 0 0 14px rgba(255,110,180,0.4); }
.send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.mic-btn { width: 42px; height: 42px; border-radius: 50%; background: rgba(255,110,180,0.1); border: 1px solid rgba(255,110,180,0.3); color: #ff6eb4; font-size: 1rem; cursor: pointer; flex-shrink: 0; transition: all 0.2s; }
.mic-btn.on { background: #ff6eb4; color: white; animation: pulse 1s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255,110,180,0.7); } 70% { box-shadow: 0 0 0 10px rgba(255,110,180,0); } 100% { box-shadow: 0 0 0 0 rgba(255,110,180,0); } }
</style>
</head>
<body>

<div class="top">
  <div class="avatar">P.E.P</div>
  <div>
    <div class="name">P.E.P.P.E.R</div>
    <div class="status" id="statusTxt">Online</div>
  </div>
  <div class="top-right">
    <button class="icon-btn" onclick="getWeather()" title="Weather">&#9925;</button>
    <button class="icon-btn" onclick="getNews()" title="News">&#128240;</button>
    <div class="clk" id="clk">--:--</div>
  </div>
</div>

<div class="weather-bar" id="weatherBar">
  <span id="wIcon">&#9728;</span>
  <span class="w-temp" id="wTemp">--</span>
  <span id="wDesc">--</span>
  <span id="wCity" style="margin-left:auto;font-size:0.6rem;opacity:0.5"></span>
</div>

<div class="msgs" id="msgs"></div>
<div class="typing" id="typing"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>

<div class="bot">
  <textarea id="msg" rows="1" placeholder="Talk to PEPPER..."></textarea>
  <button class="mic-btn" id="micBtn" onclick="toggleMic()">&#127908;</button>
  <button class="send-btn" id="sbtn" onclick="send()">&#9658;</button>
</div>

<script>
var BASE = 'https://maria-assistant-fthu.onrender.com';

// ── MEMORY (auto, no separate page) ──
var MEM = {};
try { var ms = localStorage.getItem('pepper_mem'); if(ms) MEM = JSON.parse(ms); } catch(e) {}
function saveMem(k,v){ MEM[k]=v; try{localStorage.setItem('pepper_mem',JSON.stringify(MEM));}catch(e){} }
function autoDetect(txt){
  var n = txt.match(/my name is ([a-zA-Z]+)/i)||txt.match(/mera naam ([a-zA-Z]+)/i)||txt.match(/call me ([a-zA-Z]+)/i);
  if(n&&n[1]&&n[1].length>1) saveMem('name', n[1].charAt(0).toUpperCase()+n[1].slice(1));
  var c = txt.match(/i (?:live|am from|stay) in ([a-zA-Z ]+)/i)||txt.match(/main ([a-zA-Z]+) mein (?:rehta|rehti)/i);
  if(c&&c[1]) saveMem('city', c[1].trim());
  var a = txt.match(/i(?:'m| am) (\d+) years old/i)||txt.match(/meri umar (\d+)/i)||txt.match(/(\d+) saal ka/i);
  if(a&&a[1]) saveMem('age', a[1]);
  var j = txt.match(/i(?:'m| am) a ([a-zA-Z ]+)/i)||txt.match(/mera kaam ([a-zA-Z ]+) hai/i);
  if(j&&j[1]&&j[1].length>2&&j[1].length<30) saveMem('job', j[1].trim());
}
function memCtx(){
  var keys=Object.keys(MEM); if(!keys.length) return '';
  return keys.map(function(k){return k+': '+MEM[k];}).join(', ');
}

// ── CLOCK ──
setInterval(function(){
  var n=new Date(),h=n.getHours(),m=n.getMinutes();
  document.getElementById('clk').textContent=(h<10?'0'+h:h)+':'+(m<10?'0'+m:m);
},1000);

// ── TEXTAREA ──
document.getElementById('msg').addEventListener('input',function(){
  this.style.height='auto';
  this.style.height=Math.min(this.scrollHeight,100)+'px';
});
document.getElementById('msg').addEventListener('keydown',function(e){
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}
});

// ── MESSAGES ──
function addMsg(role, text, isHtml){
  var msgs=document.getElementById('msgs');
  var d=document.createElement('div');
  d.className='msg '+role;
  var content = isHtml ? text : text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
  d.innerHTML='<div class="lbl">'+(role==='u'?'YOU':'PEPPER')+'</div><div class="bub">'+content+'</div>';
  msgs.appendChild(d);
  msgs.scrollTop=msgs.scrollHeight+1000;
  return d;
}

// ── CLEAN TEXT FOR SPEECH ──
function cleanForSpeech(t){
  var out='';
  for(var i=0;i<t.length;i++){
    var c=t.charCodeAt(i);
    if((c>=32&&c<=126)||(c>=2304&&c<=2431)) out+=t[i];
    else out+=' ';
  }
  return out.replace(/ +/g,' ').trim();
}

// ── SPEAK ──
function speak(text){
  if(!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  var clean=cleanForSpeech(text);
  if(!clean) return;
  var u=new SpeechSynthesisUtterance(clean);
  u.rate=0.93; u.pitch=1.05; u.volume=1;
  var voices=window.speechSynthesis.getVoices();
  for(var i=0;i<voices.length;i++){
    if(voices[i].lang==='hi-IN'||voices[i].lang==='en-IN'){u.voice=voices[i];break;}
  }
  window.speechSynthesis.speak(u);
}
if(window.speechSynthesis) window.speechSynthesis.onvoiceschanged=function(){window.speechSynthesis.getVoices();};

// ── CHAT ──
function askPepper(txt, silent){
  var btn=document.getElementById('sbtn');
  btn.disabled=true;
  document.getElementById('statusTxt').textContent='Thinking...';
  document.getElementById('typing').classList.add('show');
  document.getElementById('msgs').scrollTop=99999;

  fetch(BASE+'/chat',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({message:txt, memory:memCtx()})
  })
  .then(function(r){return r.json();})
  .then(function(d){
    document.getElementById('typing').classList.remove('show');
    btn.disabled=false;
    document.getElementById('statusTxt').textContent='Online';
    var reply=d.reply||'Kuch toh hua, dobara try karo';
    addMsg('b', reply);
    if(!silent) speak(reply);
  })
  .catch(function(){
    document.getElementById('typing').classList.remove('show');
    btn.disabled=false;
    document.getElementById('statusTxt').textContent='Online';
    if(!silent) addMsg('b','Connection error, dobara try karo');
  });
}

function send(){
  var inp=document.getElementById('msg');
  var txt=inp.value.trim();
  if(!txt) return;
  inp.value=''; inp.style.height='auto';

  addMsg('u', txt);

  // Image generation command - detect before sending to AI
  if(txt.match(/(generate|create|make|draw|show|bana).{0,15}(image|photo|picture|img|tasveer)/i)){
    var prompt=txt.replace(/(generate|create|make|draw|show|bana).{0,15}(image|photo|picture|img|tasveer).{0,10}(of|for|ka|ki)?/i,'').trim();
    if(!prompt) prompt=txt;
    generateImage(prompt);
    return;
  }
  autoDetect(txt);
  askPepper(txt, false);
}

// ── IMAGE GENERATION (via backend) ──
function generateImage(prompt){
  var d=addMsg('b','Generating image, please wait up to 30 seconds...', false);
  fetch(BASE+'/imagine',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({prompt:prompt})
  })
  .then(function(r){return r.json();})
  .then(function(data){
    if(data.image){
      d.querySelector('.bub').innerHTML='<img class="msg-img" src="'+data.image+'" alt="'+prompt+'"><br><span style="font-size:0.7rem;color:rgba(255,255,255,0.4)">'+prompt+'</span>';
    } else {
      d.querySelector('.bub').innerHTML='Model load ho raha hai, 30 second baad try karo';
    }
    document.getElementById('msgs').scrollTop=99999;
  })
  .catch(function(){
    d.querySelector('.bub').innerHTML='Image generate nahi ho paya, dobara try karo';
  });
}

// ── WEATHER ──
function getWeather(){
  var city = MEM.city || prompt('Enter your city:');
  if(!city) return;
  saveMem('city', city);
  fetch(BASE+'/weather?city='+encodeURIComponent(city))
  .then(function(r){return r.json();})
  .then(function(d){
    if(d.error){ addMsg('b', 'Weather nahi mila: '+d.error); return; }
    var bar=document.getElementById('weatherBar');
    document.getElementById('wTemp').textContent=d.temp+'C';
    document.getElementById('wDesc').textContent=d.description;
    document.getElementById('wCity').textContent=d.city+', '+d.country;
    bar.classList.add('show');
    addMsg('b', d.city+' mein abhi '+d.temp+' degree C hai. '+d.description+'. Feels like '+d.feels_like+'C. Humidity '+d.humidity+'%.');
  })
  .catch(function(){ addMsg('b','Weather service unavailable'); });
}

// ── NEWS ──
function getNews(){
  addMsg('u','Show me latest news');
  var d=addMsg('b','Fetching news...');
  fetch(BASE+'/news?category=general')
  .then(function(r){return r.json();})
  .then(function(data){
    if(!data.articles||!data.articles.length){ d.querySelector('.bub').textContent='News nahi mila'; return; }
    var h='<b style="font-size:0.72rem;color:#ff6eb4">TOP NEWS</b><br><br>';
    data.articles.forEach(function(a){
      h+='<div class="news-item"><div class="news-title">'+a.title+'</div><div class="news-src">'+a.source+'</div></div>';
    });
    d.querySelector('.bub').innerHTML=h;
    document.getElementById('msgs').scrollTop=99999;
  })
  .catch(function(){ d.querySelector('.bub').textContent='News service unavailable'; });
}

// ── VOICE INPUT ──
var recog=null, listening=false;
function toggleMic(){
  if(listening){ stopMic(); return; }
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ addMsg('b','Chrome mein voice use karo'); return; }
  if(window.speechSynthesis) window.speechSynthesis.cancel();
  recog=new SR();
  recog.lang='hi-IN';
  recog.continuous=false;
  recog.interimResults=false;
  recog.onstart=function(){
    listening=true;
    document.getElementById('micBtn').classList.add('on');
    document.getElementById('statusTxt').textContent='Listening...';
  };
  recog.onresult=function(e){
    var txt=e.results[0][0].transcript.trim();
    stopMic();
    if(txt){ addMsg('u',txt); autoDetect(txt); askPepper(txt,false); }
  };
  recog.onerror=function(){ stopMic(); };
  recog.onend=function(){ stopMic(); };
  try{ recog.start(); }catch(e){ stopMic(); }
}
function stopMic(){
  listening=false;
  document.getElementById('micBtn').classList.remove('on');
  document.getElementById('statusTxt').textContent='Online';
  if(recog){ try{recog.stop();}catch(e){} recog=null; }
}

// ── AUTO GREET ──
setTimeout(function(){
  var h=new Date().getHours();
  var t=h<12?'morning':h<17?'afternoon':'evening';
  var name=MEM.name?', '+MEM.name:'';
  askPepper('Give a short warm '+t+' greeting in Hinglish'+name+'. No emojis. Max 2 sentences. You are PEPPER, Tony Starks AI.', true);
},1000);
</script>
</body>
</html>
