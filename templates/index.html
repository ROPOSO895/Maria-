body::after{content:'';position:fixed;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,0.3) 0%,rgba(0,0,0,0.1) 40%,rgba(0,0,0,0.6) 75%,rgba(0,0,0,0.92) 100%);z-index:1}

/* SIDEBAR OVERLAY */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:200;backdrop-filter:blur(4px)}
.overlay.on{display:block}
.sidebar{position:fixed;top:0;left:0;bottom:0;width:78%;max-width:300px;background:rgba(5,5,15,0.92);backdrop-filter:blur(20px);z-index:201;transform:translateX(-100%);transition:transform 0.3s cubic-bezier(0.4,0,0.2,1);display:flex;flex-direction:column;border-right:1px solid rgba(0,229,255,0.15)}
.sidebar.on{transform:translateX(0)}
.sb-top{padding:16px 14px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border)}
.sb-search{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:8px 14px;color:var(--text);font-family:'Inter',sans-serif;font-size:0.82rem;outline:none}
.sb-search::placeholder{color:var(--dim)}
.sb-newbtn{width:34px;height:34px;border-radius:50%;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sb-body{flex:1;overflow-y:auto;padding:10px 8px}
.sb-body::-webkit-scrollbar{width:0}
.sb-section{font-size:0.6rem;color:var(--dim);letter-spacing:0.1em;padding:8px 8px 4px;font-family:'Orbitron',sans-serif}
.sb-item{padding:10px 10px;border-radius:10px;font-size:0.82rem;color:var(--dim);cursor:pointer;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:8px}
.sb-item:hover,.sb-item.on{background:var(--bg3);color:var(--text)}
.sb-item-ic{font-size:0.9rem;flex-shrink:0}
.sb-bottom{padding:12px 10px;border-top:1px solid var(--border)}
.sb-user{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;cursor:pointer}
.sb-user:hover{background:var(--bg3)}
.sb-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--cyan),var(--pink));display:flex;align-items:center;justify-content:center;font-size:0.65rem;font-weight:700;font-family:'Orbitron',sans-serif;color:#000;flex-shrink:0}
.sb-name{font-size:0.82rem;font-weight:500}

/* TOP BAR */
.top{background:rgba(0,0,0,0.25);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:10px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);flex-shrink:0;backdrop-filter:blur(20px);position:relative;z-index:10}
.menu-btn{width:36px;height:36px;border-radius:50%;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}

/* SPINNING LOGO */
.logo-wrap{display:flex;align-items:center;gap:8px}
.logo-ring{width:30px;height:30px;position:relative;flex-shrink:0}
.logo-ring svg{width:100%;height:100%;animation:none}
.logo-ring svg.spin{animation:spin 1s linear infinite}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.logo-inner{position:absolute;inset:5px;border-radius:50%;background:linear-gradient(135deg,var(--cyan),var(--pink));display:flex;align-items:center;justify-content:center;font-size:0.4rem;font-weight:700;font-family:'Orbitron',sans-serif;color:#000}
.logo-name{font-family:'Orbitron',sans-serif;font-size:0.75rem;font-weight:700;color:var(--text);letter-spacing:0.1em}
.logo-sub{font-size:0.55rem;color:var(--dim);letter-spacing:0.05em}
.top-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.clk{font-family:'Orbitron',sans-serif;font-size:0.7rem;color:var(--dim)}
.new-chat-btn{padding:6px 12px;border-radius:14px;background:var(--bg3);border:1px solid var(--border);color:var(--dim);font-family:'Inter',sans-serif;font-size:0.7rem;cursor:pointer}
.new-chat-btn:active{background:rgba(255,255,255,0.05)}

/* PAGES */
.pg{display:none;flex:1;overflow-y:auto;flex-direction:column;position:relative;z-index:2}
.pg.on{display:flex}
.pg::-webkit-scrollbar{width:2px}
.pg::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:2px}

/* WELCOME */
.welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;position:relative;z-index:2}
.welcome-logo{width:60px;height:60px;margin:0 auto 16px;border-radius:50%;background:linear-gradient(135deg,var(--cyan),var(--pink));display:flex;align-items:center;justify-content:center;font-family:'Orbitron',sans-serif;font-size:0.55rem;font-weight:700;color:#000;box-shadow:0 0 30px rgba(0,229,255,0.3)}
.welcome h2{font-family:'Orbitron',sans-serif;font-size:1.1rem;font-weight:700;margin-bottom:6px;background:linear-gradient(135deg,var(--cyan),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.welcome p{font-size:0.8rem;color:var(--dim);margin-bottom:24px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:300px}
.chip{padding:8px 14px;border-radius:20px;background:var(--bg2);border:1px solid var(--border);color:var(--text);font-size:0.75rem;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all 0.2s}
.chip:active{background:var(--bg3);border-color:rgba(0,229,255,0.3)}
.chip-ic{font-size:0.9rem}

/* MSGS */
.msgs{flex:1;overflow-y:auto;padding:14px;padding-bottom:160px;display:flex;flex-direction:column;gap:14px;position:relative;z-index:2}
.msgs::-webkit-scrollbar{width:2px}
.msgs::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:2px}
.msg{display:flex;flex-direction:column;max-width:85%}
.msg.u{align-self:flex-end;align-items:flex-end}
.msg.b{align-self:flex-start;align-items:flex-start}
.msg-row{display:flex;align-items:flex-start;gap:10px;max-width:88%}
.msg-row.u{flex-direction:row-reverse;align-self:flex-end}
.msg-row.b{align-self:flex-start}
.msg-av{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:0.5rem;font-weight:700;font-family:'Orbitron',sans-serif;margin-top:2px}
.msg-av.b{background:linear-gradient(135deg,var(--cyan),var(--pink));color:#000}
.msg-av.u{background:var(--bg3);border:1px solid var(--border);color:var(--dim)}
.bub{padding:10px 14px;border-radius:18px;font-size:0.88rem;line-height:1.7;font-weight:400}
.msg-row.u .bub{background:var(--bg2);border:1px solid var(--border);border-bottom-right-radius:4px}
.msg-row.b .bub{background:transparent;border:none;color:var(--text);padding-left:0}

/* TYPING */
.typing-row{display:flex;align-items:center;gap:10px;padding:0 14px;margin-top:-4px}
.typing{display:none;background:transparent;padding:8px 0;align-items:center;gap:10px}
.typing.show{display:flex}
.maria-thinking{width:28px;height:28px;position:relative;flex-shrink:0}
.maria-thinking svg{width:100%;height:100%;animation:spin 1s linear infinite}
.maria-thinking-inner{position:absolute;inset:5px;border-radius:50%;background:linear-gradient(135deg,var(--cyan),var(--pink));display:flex;align-items:center;justify-content:center;font-size:0.38rem;font-weight:700;font-family:'Orbitron',sans-serif;color:#000}
.thinking-text{font-size:0.75rem;color:var(--dim);font-style:italic}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

/* INPUT AREA */
.inp-wrap{position:fixed;bottom:0;left:0;right:0;background:rgba(0,0,0,0.55);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:10px 14px 16px;z-index:99;border-top:1px solid rgba(0,229,255,0.12)}
.inp-box{background:var(--bg2);border:1px solid var(--border);border-radius:26px;display:flex;align-items:flex-end;gap:6px;padding:6px 6px 6px 16px;transition:border-color 0.2s}
.inp-box:focus-within{border-color:rgba(255,255,255,0.2)}
#msg{flex:1;background:transparent;border:none;color:var(--text);font-family:'Inter',sans-serif;font-size:0.9rem;outline:none;resize:none;max-height:120px;padding:4px 0;line-height:1.5}
#msg::placeholder{color:var(--dim)}
.inp-btns{display:flex;gap:4px;align-items:center;flex-shrink:0;padding-bottom:2px}
.mic-btn{width:36px;height:36px;border-radius:50%;background:transparent;border:none;color:var(--dim);font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
.mic-btn.on{color:var(--cyan);animation:pulse 1s infinite}
@keyframes pulse{0%{filter:drop-shadow(0 0 0 rgba(0,229,255,0.7))}70%{filter:drop-shadow(0 0 6px rgba(0,229,255,0))}100%{filter:drop-shadow(0 0 0 rgba(0,229,255,0))}}
.send-btn{width:36px;height:36px;border-radius:50%;background:var(--dim);border:none;color:#000;font-size:0.9rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s;font-weight:700}
.send-btn.active{background:white;color:#000}
.send-btn:disabled{opacity:0.3}

@keyframes girlFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

.feat-item{padding:12px 4px;border-radius:14px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);text-align:center;cursor:pointer;transition:all 0.2s}
.feat-item:active{background:rgba(0,229,255,0.12);border-color:rgba(0,229,255,0.3)}
.feat-ic{font-size:1.2rem;margin-bottom:4px}
.feat-lb{font-size:0.5rem;color:rgba(255,255,255,0.55);letter-spacing:0.05em}

#splashScreen{position:fixed;inset:0;z-index:9999;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0}
#splashScreen.hide{animation:splashFade 0.8s ease forwards}
@keyframes splashFade{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.05);pointer-events:none}}
.splash-girl{width:260px;height:auto;filter:drop-shadow(0 0 40px rgba(0,229,255,0.6));animation:splashGirlIn 0.8s cubic-bezier(0.34,1.56,0.64,1) forwards}
@keyframes splashGirlIn{0%{transform:translateY(40px);opacity:0}100%{transform:translateY(0);opacity:1}}
.splash-logo{font-family:'Orbitron',sans-serif;font-size:1.6rem;font-weight:700;background:linear-gradient(90deg,#00e5ff,#ff2d78);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:0.3em;animation:splashLogoIn 0.6s 0.4s ease both}
@keyframes splashLogoIn{0%{opacity:0;letter-spacing:0.8em}100%{opacity:1;letter-spacing:0.3em}}
.splash-sub{font-size:0.6rem;color:rgba(255,255,255,0.35);letter-spacing:0.25em;margin-top:6px;animation:splashLogoIn 0.6s 0.7s ease both}
.splash-bar{width:140px;height:2px;background:rgba(255,255,255,0.08);border-radius:2px;margin-top:24px;overflow:hidden;animation:splashLogoIn 0.4s 0.9s ease both}
.splash-bar-fill{height:100%;width:0%;background:linear-gradient(90deg,#00e5ff,#ff2d78);border-radius:2px;animation:splashFill 1.4s 0.9s ease forwards}
@keyframes splashFill{0%{width:0%}100%{width:100%}}


/* ONBOARDING */
#onboardScreen{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,0.92);backdrop-filter:blur(20px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;gap:0}
.ob-step{display:none;flex-direction:column;align-items:center;text-align:center;gap:16px;width:100%;max-width:320px;animation:obIn 0.5s cubic-bezier(0.34,1.56,0.64,1)}
.ob-step.active{display:flex}
@keyframes obIn{0%{opacity:0;transform:translateY(30px)}100%{opacity:1;transform:translateY(0)}}
.ob-title{font-family:'Orbitron',sans-serif;font-size:1.1rem;color:#fff;font-weight:700;line-height:1.4}
.ob-sub{font-size:0.78rem;color:rgba(255,255,255,0.5);line-height:1.6}
.ob-input{width:100%;padding:14px 16px;border-radius:14px;background:rgba(255,255,255,0.08);border:1px solid rgba(0,229,255,0.3);color:#fff;font-size:0.9rem;outline:none;text-align:center;font-family:'Inter',sans-serif}
.ob-input::placeholder{color:rgba(255,255,255,0.3)}
.ob-btn{padding:14px 40px;border-radius:14px;background:linear-gradient(135deg,#00e5ff,#ff2d78);border:none;color:#000;font-family:'Orbitron',sans-serif;font-size:0.75rem;font-weight:700;cursor:pointer;letter-spacing:0.1em;width:100%}
.ob-skip{font-size:0.65rem;color:rgba(255,255,255,0.25);cursor:pointer;margin-top:4px}
.ob-chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.ob-chip{padding:8px 16px;border-radius:20px;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.15);color:rgba(255,255,255,0.7);font-size:0.72rem;cursor:pointer;transition:all 0.2s}
.ob-chip.selected{background:rgba(0,229,255,0.15);border-color:rgba(0,229,255,0.5);color:#00e5ff}

/* PARTICLES */
.particle{position:fixed;pointer-events:none;border-radius:50%;z-index:1000;animation:particleFly 1s ease-out forwards}
@keyframes particleFly{0%{opacity:1;transform:scale(1) translate(0,0)}100%{opacity:0;transform:scale(0) translate(var(--tx),var(--ty))}}

/* TYPING ANIMATION for MARIA messages */
.typing-dots{display:inline-flex;gap:4px;align-items:center}
.typing-dots span{width:6px;height:6px;border-radius:50%;background:var(--cyan);animation:dotPulse 1.2s ease-in-out infinite}
.typing-dots span:nth-child(2){animation-delay:0.2s}
.typing-dots span:nth-child(3){animation-delay:0.4s}
@keyframes dotPulse{0%,60%,100%{transform:scale(0.6);opacity:0.4}30%{transform:scale(1);opacity:1}}

/* SOUND WAVE on mic */
.sound-wave{display:none;align-items:center;gap:2px;height:20px}
.sound-wave.active{display:flex}
.sound-wave span{width:3px;border-radius:2px;background:var(--cyan);animation:wave 0.8s ease-in-out infinite}
.sound-wave span:nth-child(1){animation-delay:0s;height:6px}
.sound-wave span:nth-child(2){animation-delay:0.1s;height:14px}
.sound-wave span:nth-child(3){animation-delay:0.2s;height:20px}
.sound-wave span:nth-child(4){animation-delay:0.3s;height:14px}
.sound-wave span:nth-child(5){animation-delay:0.4s;height:6px}
@keyframes wave{0%,100%{transform:scaleY(0.5)}50%{transform:scaleY(1)}}

/* MARIA message glow effect */
.msg-row.b .bub{position:relative;overflow:hidden}
.msg-row.b .bub::after{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(ellipse,rgba(0,229,255,0.06) 0%,transparent 70%);pointer-events:none}


/* ═══ VISUAL EFFECTS ═══ */

/* Ripple on tap */
@keyframes rippleOut{
  0%{transform:scale(1);opacity:0.8}
  100%{transform:scale(5);opacity:0}
}

/* Cursor trail */
.cursor-trail{
  position:fixed;pointer-events:none;border-radius:50%;
  width:8px;height:8px;background:rgba(0,229,255,0.5);
  z-index:9997;transition:left 0.05s,top 0.05s;
}

/* Message slide in */
.msg-row{
  animation:msgSlideIn 0.35s cubic-bezier(0.34,1.56,0.64,1);
}
@keyframes msgSlideIn{
  0%{opacity:0;transform:translateY(12px) scale(0.97)}
  100%{opacity:1;transform:translateY(0) scale(1)}
}

/* MARIA avatar breathing glow */
.msg-av.b{
  animation:avatarPulse 2.5s ease-in-out infinite !important;
}
@keyframes avatarPulse{
  0%,100%{box-shadow:0 0 6px rgba(0,229,255,0.3),0 0 0 1px rgba(0,229,255,0.15)}
  50%{box-shadow:0 0 18px rgba(0,229,255,0.8),0 0 0 2px rgba(0,229,255,0.4)}
}

/* AI Girl breathing glow */
#aiGirlOverlay img{
  animation:girlFloat 3s ease-in-out infinite, girlGlow 4s ease-in-out infinite !important;
}
@keyframes girlGlow{
  0%,100%{filter:drop-shadow(0 0 18px rgba(0,229,255,0.5))}
  50%{filter:drop-shadow(0 0 40px rgba(0,229,255,0.9)) drop-shadow(0 0 70px rgba(255,45,120,0.4))}
}

/* Send button glow when active */
#sbtn:not(:disabled){
  transition:all 0.2s ease;
}

/* Input focus glow */
#msg:focus{
  box-shadow:0 0 0 1.5px rgba(0,229,255,0.5),0 0 25px rgba(0,229,255,0.12) !important;
  transition:box-shadow 0.3s ease;
}

/* Maria toast */
.maria-toast{
  position:fixed;top:70px;left:50%;transform:translateX(-50%);
  background:rgba(0,10,20,0.95);border:1px solid rgba(0,229,255,0.3);
  border-radius:16px;padding:12px 20px;font-size:0.78rem;color:#fff;
  z-index:400;backdrop-filter:blur(20px);text-align:center;
  animation:toastIn 0.4s cubic-bezier(0.34,1.56,0.64,1);
  max-width:280px;
}
@keyframes toastIn{
  0%{opacity:0;top:50px}
  100%{opacity:1;top:70px}
}
